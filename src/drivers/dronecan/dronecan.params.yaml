module_name: dronecan
parameters:
- group: DroneCAN
  definitions:
    DC_ENABLE:
      description:
        short: DroneCAN mode
        long: |-
          0 - DroneCAN disabled.
          1 - Enables support for DroneCAN sensors without dynamic node ID allocation and firmware update.
          2 - Enables support for DroneCAN sensors with dynamic node ID allocation and firmware update.
          3 - Enables support for DroneCAN sensors and actuators with dynamic node ID allocation and firmware update. Also sets the motor control outputs to DroneCAN.
      type: enum
      values:
        0: Disabled
        1: Sensors Manual Config
        2: Sensors Automatic Config
        3: Sensors and Actuators (ESCs) Automatic Config
      default: 0
      min: 0
      max: 3
      reboot_required: true
    DC_NODE_ID:
      description:
        short: DroneCAN Node ID
        long: |-
          Static node ID of this node on the bus. PX4 acts as the DroneCAN server
          (not a dynamic-allocation client), so this must be a valid unicast ID.
          Read the specs at https://dronecan.github.io/ to learn more about Node ID.
      type: int32
      default: 1
      min: 1
      max: 125
      reboot_required: true
    DC_BITRATE:
      description:
        short: DroneCAN CAN bus bitrate
      type: int32
      default: 1000000
      unit: bit/s
      min: 20000
      max: 1000000
      reboot_required: true
    DC_SUB_GPS:
      description:
        short: DroneCAN GPS subscription
        long: |-
          Subscribe to DroneCAN GNSS (Fix/Fix2/Auxiliary + RelPosHeading) and publish
          sensor_gps. Migrated from UAVCAN_SUB_GPS.
      type: boolean
      default: 1
      reboot_required: true
    DC_PUB_RTCM:
      description:
        short: DroneCAN RTCM stream publication
        long: |-
          Forward GCS RTCM corrections (gps_inject_data) onto the bus as
          uavcan.equipment.gnss.RTCMStream. Migrated from UAVCAN_PUB_RTCM.
      type: boolean
      default: 0
      reboot_required: true
    DC_PUB_MBD:
      description:
        short: DroneCAN MovingBaselineData publication
        long: |-
          Forward GCS corrections onto the bus as ardupilot.gnss.MovingBaselineData
          (moving-baseline RTK). Migrated from UAVCAN_PUB_MBD.
      type: boolean
      default: 0
      reboot_required: true
    DC_SUB_MBD:
      description:
        short: DroneCAN MovingBaselineData subscription
        long: |-
          Subscribe to incoming ardupilot.gnss.MovingBaselineData and forward it to
          gps_dump for PPK logging. Migrated from UAVCAN_SUB_MBD.
      type: boolean
      default: 0
      reboot_required: true
    DC_POOL:
      description:
        short: DroneCAN memory pool size
        long: |-
          Bytes of the libcanard block pool handed to the node at start. RX
          reassembly and TX enqueue share this pool; raise it on busy/high-node-count
          buses if 'dronecan status' shows the peak block usage approaching capacity.
          Bounded by the static pool ceiling (DC_POOL_MAX, a build constant).
      type: int32
      default: 8192
      min: 2048
      max: 16384
      reboot_required: true
    DC_MIGRATED:
      description:
        short: DroneCAN param migration sentinel
        long: |-
          Internal. Set to 1 once the one-time UAVCAN_* -> DC_* parameter migration
          has run; keeps the migration idempotent across reboots. Not user-facing.
      type: int32
      default: 0
      min: 0
      max: 1
